name: release

# Every published release gets freshly built binaries attached by CI,
# so nobody has to trust a binary that was not built from the tagged
# source.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Validate WebUI before building and uploading release binaries.
  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webui

      # Typechecks and rebuilds payload/webui.html from committed sources.
      - name: Build and embed
        run: npm run build:embed
        working-directory: webui

      # Ensure committed embedded HTML matches the source.
      - name: Check embedded page is up to date
        run: |
          if ! git diff --quiet -- payload/webui.html; then
            echo "payload/webui.html is stale; run 'npm run build:embed' in webui/ and commit it"
            git diff --stat -- payload/webui.html
            exit 1
          fi

  # Build and attach binaries only after WebUI validation succeeds.
  attach-binaries:
    needs: webui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Download PS5 payload SDK
        run: |
          curl -fsSL -o ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o ps5-payload-sdk.zip -d /opt

      - name: Build receiver
        run: |
          make -C payload PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          mv payload/pkg-receiver.elf pkg-receiver.elf

      - name: Build test-only receiver
        run: |
          make -C payload PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk TEST_ONLY=1
          mv payload/pkg-receiver-testonly.elf pkg-receiver-testonly.elf

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            pkg-receiver.elf pkg-receiver-testonly.elf --clobber
